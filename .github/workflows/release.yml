name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install LLVM / Clang, libbpf and multilib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc-multilib make

      - name: Compile eBPF Object
        run: make bpf

      - name: Build Userspace Binaries (linux/amd64 & linux/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/enclave-xdp-linux-amd64 ./cmd/enclave-xdp
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/enclave-xdp-linux-arm64 ./cmd/enclave-xdp
          cp bpf/enclave_xdp.o dist/enclave_xdp.o
          cd dist
          sha256sum enclave-xdp-linux-amd64 enclave-xdp-linux-arm64 enclave_xdp.o > SHA256SUMS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/enclave-xdp-linux-amd64
            dist/enclave-xdp-linux-arm64
            dist/enclave_xdp.o
            dist/SHA256SUMS
          generate_release_notes: false
